AWSTemplateFormatVersion: "2010-09-09"
Description: Corgi Note for AWS Learner Lab - manual Amplify hosting, Cognito, API Gateway, Lambda, DynamoDB and private S3 photos. No direct CloudFront or IAM resources.
Parameters:
  RoleName:
    Type: String
    Default: LabRole
    AllowedPattern: "[a-zA-Z0-9+=,.@_-]{1,64}"
    Description: Existing Lambda execution role name, as in the working course template. Do not create or modify the lab's foundation roles.
  DeploymentBucket:
    Type: String
    Default: corgi-note-deploy-6909035047
    Description: Existing private S3 bucket containing the backend ZIP, in the stack's region.
  LambdaObjectKey:
    Type: String
    Default: lambda.zip
    Description: Object key of the bundled backend ZIP; index.mjs must be at the archive root.
  CognitoDomainPrefix:
    Type: String
    Default: corgi-note-6909035047-lab
    AllowedPattern: "[a-z0-9][a-z0-9-]{2,50}"
    Description: Choose a new unique lowercase hosted-login domain prefix.
  FrontendBranch:
    Type: String
    Default: main
    AllowedPattern: "[a-z0-9][a-z0-9-]{0,30}"
    Description: Amplify manual-deployment branch. Keep main unless you need another branch.
Resources:
  Notes:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: owner, AttributeType: S }
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: owner, KeyType: HASH }
        - { AttributeName: id, KeyType: RANGE }
      SSESpecification: { SSEEnabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
  Photos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
  PhotosPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Photos
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt Photos.Arn, !Sub "${Photos.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": false } }
  Frontend:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub "${AWS::StackName}-web"
      Platform: WEB
      Description: Static Corgi Note frontend. Upload the built website ZIP manually to the existing branch; no Git connection or Amplify backend build is required.
      CustomHeaders: !Sub |
        customHeaders:
          - pattern: '**/*'
            headers:
              - key: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
              - key: X-Content-Type-Options
                value: nosniff
              - key: X-Frame-Options
                value: DENY
              - key: Referrer-Policy
                value: strict-origin-when-cross-origin
              - key: Content-Security-Policy
                value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: https://${Photos}.s3.${AWS::Region}.amazonaws.com https://${Photos}.s3.amazonaws.com; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
          - pattern: '/'
            headers:
              - key: Cache-Control
                value: no-cache, no-store, must-revalidate
          - pattern: '/index.html'
            headers:
              - key: Cache-Control
                value: no-cache, no-store, must-revalidate
          - pattern: '/config.json'
            headers:
              - key: Cache-Control
                value: no-cache, no-store, must-revalidate
  FrontendProductionBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt Frontend.AppId
      BranchName: !Ref FrontendBranch
      EnableAutoBuild: false
      Stage: PRODUCTION
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-owners"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: { CaseSensitive: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  UserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        [!Sub "https://${FrontendBranch}.${Frontend.DefaultDomain}/"]
      LogoutURLs: [!Sub "https://${FrontendBranch}.${Frontend.DefaultDomain}/"]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes }
  LoginDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          [!Sub "https://${FrontendBranch}.${Frontend.DefaultDomain}"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowCredentials: false
        MaxAge: 600
  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      Name: CognitoOwners
      JwtConfiguration:
        Audience: [!Ref UserClient]
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  JournalFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-journal"
      Runtime: nodejs24.x
      Handler: index.handler
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LambdaObjectKey
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}"
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 28
      # Use the account's shared concurrency, matching the working lab Lambda pattern.
      Environment:
        Variables:
          TABLE_NAME: !Ref Notes
          PHOTO_BUCKET: !Ref Photos
          WEB_ORIGIN: !Sub "https://${FrontendBranch}.${Frontend.DefaultDomain}"
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt JournalFunction.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "ANY /api/{proxy+}"
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      AuthorizationScopes: [openid]
      Target: !Sub "integrations/${ApiIntegration}"
  ApiPreflightRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "OPTIONS /api/{proxy+}"
      AuthorizationType: NONE
      # The Lambda answers OPTIONS with 204 before checking JWT claims.
      # API Gateway adds the headers from CorsConfiguration above.
      Target: !Sub "integrations/${ApiIntegration}"
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        { ThrottlingBurstLimit: 20, ThrottlingRateLimit: 10 }
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JournalFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/*"
  FunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-journal"
      RetentionInDays: 14
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref JournalFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  SiteUrl:
    { Value: !Sub "https://${FrontendBranch}.${Frontend.DefaultDomain}/" }
  ApiUrl:
    { Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com" }
  AmplifyAppId: { Value: !GetAtt Frontend.AppId }
  AmplifyBranch: { Value: !Ref FrontendBranch }
  PhotoBucket: { Value: !Ref Photos }
  NotesTable: { Value: !Ref Notes }
  UserPoolId: { Value: !Ref UserPool }
  ClientId: { Value: !Ref UserClient }
  LoginDomain:
    {
      Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com",
    }
  FrontendConfig:
    Description: Copy this entire JSON value into dist/web/config.json AFTER building, before zipping the frontend for Amplify.
    Value: !Sub '{"mode":"aws","clientId":"${UserClient}","domain":"https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com","redirectUri":"https://${FrontendBranch}.${Frontend.DefaultDomain}/","apiBaseUrl":"https://${Api}.execute-api.${AWS::Region}.amazonaws.com"}'
